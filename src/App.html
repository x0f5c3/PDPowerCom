<main class="container">
    <div class="left" id="language-switcher">
        <label id="lang_label">语言 Language: </label>
        <button id="lang-en" class="lang-btn" @click="applyLanguage('en')">English</button>
        <button id="lang-zh" class="lang-btn active" @click="applyLanguage('zh')">中文</button>
        <button id="lang-ja" class="lang-btn" @click="applyLanguage('ja')">日本語</button>
        <button id="lang-ru" class="lang-btn" @click="applyLanguage('ru')">Русский</button>
    </div>

    <div class="left" id="serial-select">
    <select id="serial-port-list">
        <option value="" data-i18n="selectPort">请选择串口</option>
    </select>
    <button id="open-serial" data-i18n="open">打开</button>
    </div>

    <div class="grid-container">
        <div class="measurement-panel">
            <div class="measurement-title" >
                <label data-i18n="deviceOutput">设备输出数据</label>
                <div class="output-state">
                    <div id="output-state-indicator" class="output-state indicator":class="measurements.mode">{{ measurements.mode }}</div>
                </div>
            </div>
            <div class="measurement-container">
                <div class="measurement-box">
                    <label data-i18n="voltage">电压</label>
                    <div id="voltage-value" class="measurement-value">{{ measurements.voltage.toFixed(3) }} V</div>
                </div>
                <div class="measurement-box">
                    <label data-i18n="current">电流</label>
                    <div id="current-value" class="measurement-value">{{ measurements.current.toFixed(3) }} A</div>
                </div>
            </div>
        </div>

        <div class="measurement-chart" id="measurement-chart_">
        </div>
        
        <div class="settings-panel">
            <div class="settings-title" data-i18n="settingsGroup">设置组</div>
            <div class="settings-buttons">
                <button 
                v-for="group in 5" 
                :key="group-1" 
                class="settings-btn"
                :class="{ active: currentGroup === (group-1) }"
                :data-group="group-1"
                @click="switchGroup(group-1)"
                >
                M{{ group-1 }}
                </button>
            </div>
            <div class="settings-container">
                <div class="settings-box">
                    <label data-i18n="voltage">电压</label>
                    <div class="settings-value editable" data-type="voltage">0.000 V</div>
                </div>
                <div class="settings-box">
                    <label data-i18n="current">电流</label>
                    <div class="settings-value editable" data-type="current">0.000 A</div>
                </div>
            </div>
            <div class="output-config">
                <div class="switch-container">
                    <label class="switch">
                        <input type="checkbox" id="output-enable-btn" v-model="outputEnabled" @change="toggleOutput">
                        <span class="slider round"></span>
                    </label>
                    <span class="enable-label" data-i18n="outputEnable">{{ t('outputEnable') }}</span>
                </div>
                <div>
                    <button @click="setting_refresh()" data-i18n="refresh">刷新</button>
                    <button @click="setting_save()" data-i18n="save config">保存设置</button>
                </div>
            </div>
        </div>
        <div class="device-info-panel">
            <div class="device-Info-Title" data-i18n="deviceInfo">设备信息</div>
            <label id="device_name" class="device-info-label" >Name: </label>
            <label id="device_version" class="device-info-label" >Version: </label>
            <label id="device_serial" class="device-info-label" >SN: </label>
            <label id="device_input_state" class="device-info-label" v-if="showInputState">Input Type: </label>
            <label id="device_input_voltage" class="device-info-label" v-if="showInputState">Input Voltage: </label>
            <div class="settings-box" style="margin-left:5px; margin-top: 10px; text-align: left;" v-if="showPDSettings">
                <label data-i18n="pdvoltage">PD输入设置(V)</label>
                <input 
                    type="number" 
                    step="0.1"
                    :min="DEVICE_RANGE_CONFIG[device_type].pd_voltage.min" 
                    :max="DEVICE_RANGE_CONFIG[device_type].pd_voltage.max"
                    v-model="pd_voltage"
                    @blur="handleBlurPDVoltage"
                >
                <button @click="pd_voltage_set()" data-i18n="set">设置</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" v-if="showModal" @click.self="showModal = false">
    <div class="modal-container">
        <div class="modal-header">
        <h3>{{ modalTitle }}</h3>
        <button class="modal-close" @click="showModal = false">&times;</button>
        </div>
        <div class="modal-body">
        <label>{{ modalLabel }}</label>
        <input 
            type="number" 
            v-model="modalValue" 
            :min="modalMin" 
            :max="modalMax"
            step="0.1"
            @keyup.enter="modalCallback(modalValue); showModal = false"
            autofocus
        >
        </div>
        <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" @click="showModal = false">
            {{ t('cancel') }}
        </button>
        <button 
            class="modal-btn modal-btn-confirm" 
            @click="modalCallback(modalValue); showModal = false"
        >
            {{ t('confirm') }}
        </button>
        </div>
    </div>
    </div>
</main>
